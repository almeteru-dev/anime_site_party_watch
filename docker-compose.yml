services:
  db:
    image: postgres:16-alpine
    container_name: lycoris-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: animevista
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animevista"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lycoris-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lycoris-frontend
    restart: unless-stopped
    volumes:
      - ${DOCS_DIR:-./docs}:/docs:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://backend:8080/api
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8081}
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: lycoris-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
