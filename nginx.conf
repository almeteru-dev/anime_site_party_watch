server {
    listen 8081;
    server_name localhost;

    # Конфигурация для WebSocket соединений Watch Party
    location /ws/ {
        proxy_pass http://go-backend:8080; # адрес бэкенда в Docker сети
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для стабильной работы WebSocket
        proxy_read_timeout 86400; # 24 часа, чтобы соединения не закрывались преждевременно
        proxy_send_timeout 86400;
    }

    # Проксирование остальных запросов на Next.js фронтенд
    location / {
        proxy_pass http://nextjs:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Настройки безопасности и производительности
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    client_max_body_size 10M;
}
